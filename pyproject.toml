[project]
name = "anki-agent"
version = "0.1.0"
description = "Turns lecture slides into reviewed Anki flashcards with a multimodal LLM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markdown>=3.10.2",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.5.0",
    "pygments>=2.20.0",
    "pymupdf>=1.27.2.2",
    "pymdown-extensions>=10.7",
    "requests>=2.33.1",
    "streamlit>=1.57.0",
    "python-dotenv>=1.2.2",
    "openai>=2.43.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Documentation standard: every module, public class, method and
# function carries a docstring. extend-select, not select: ruff's defaults
# (unused imports, undefined names) stay switched on.
extend-select = ["D100", "D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Read as a list, not definition by definition: one-line wrappers whose name
# already says everything, and data models with a handful of fields. A docstring
# per definition would be pure repetition there — sections and field comments do
# the work instead.
"src/frontend/api.py" = ["D103"]
"src/backend/schemas.py" = ["D101"]
"tests/*" = ["D"]  # the standard covers backend and frontend
